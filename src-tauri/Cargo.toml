[package]
name = "dictation-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Dictation tray app (Tauri 2 shell)"

[lib]
name = "dictation_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
serde.workspace = true
serde_json.workspace = true
dictation-domain.workspace = true
dictation-audio.workspace = true
dictation-platform.workspace = true
dictation-coordinator.workspace = true
transcription-protocol.workspace = true
hound.workspace = true

[lints]
workspace = true

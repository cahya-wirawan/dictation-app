[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/transcription-protocol",
    "crates/transcription-worker",
    "crates/audio",
    "crates/platform",
    "crates/coordinator",
    "crates/models",
    "crates/bench",
    "src-tauri",
]
# src-tauri needs webkit2gtk/gtk on Linux; keep plain `cargo build/test` usable
# on machines without those system libraries.
default-members = [
    "crates/domain",
    "crates/transcription-protocol",
    "crates/transcription-worker",
    "crates/audio",
    "crates/platform",
    "crates/coordinator",
    "crates/models",
    "crates/bench",
]

[workspace.package]
# Single source of truth for the app version (SemVer). Bump with
# `pnpm version:bump`, never by hand; see CHANGELOG.md.
version = "0.10.1"
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dictation-domain = { path = "crates/domain" }
transcription-protocol = { path = "crates/transcription-protocol" }
dictation-audio = { path = "crates/audio" }
dictation-platform = { path = "crates/platform" }
dictation-coordinator = { path = "crates/coordinator" }
dictation-models = { path = "crates/models" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
sha2 = "=0.11.1"
getrandom = "=0.4.3"
hound = "=3.5.1"
rubato = "=5.0.1"
audioadapter-buffers = "=5.2.0"
earshot = "=1.2.2"
cpal = "=0.18.2"
rtrb = "=0.4.1"
cmake = "=0.1.58"
cc = "=1.11.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"

# Model hashing and DSP are too slow unoptimized for meaningful dev testing.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.earshot]
opt-level = 3
